<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    width: 320px; margin: 0; padding: 14px 16px;
    font-family: "Microsoft YaHei", -apple-system, sans-serif;
    font-size: 13px; color: #1f2329; background: #fff;
  }
  h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c9cdd4; flex: none; }
  .dot.ok { background: #00b42a; }
  .dot.bad { background: #f53f3f; }
  .row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #f2f3f5; }
  .row:last-of-type { border-bottom: 0; }
  .k { color: #86909c; }
  .v { font-weight: 500; text-align: right; }
  select {
    font-family: inherit; font-size: 12.5px; border-radius: 6px; cursor: pointer;
    padding: 3px 6px; border: 1px solid #d9dbe0; background: #fff; color: #1f2329;
  }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1; padding: 8px 0; border: 0; border-radius: 6px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 500;
    background: #1664ff; color: #fff;
  }
  button:hover { background: #0e51d6; }
  button.gray { background: #f2f3f5; color: #1f2329; }
  button.gray:hover { background: #e5e6eb; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .sec { margin-top: 10px; padding-top: 10px; border-top: 1px solid #f2f3f5; }
  .err { color: #f53f3f; font-size: 12px; margin-top: 8px; word-break: break-all; }
  .tip { color: #86909c; font-size: 11.5px; line-height: 1.7; margin-top: 10px; }
  .tip b { color: #4e5969; font-weight: 500; }
  #toast { color: #00b42a; font-size: 12px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
  <h1><span class="dot" id="dot"></span>书签同步</h1>

  <div class="row"><span class="k">当前浏览器</span><span class="v" id="browser">-</span></div>
  <div class="row"><span class="k">本机服务</span><span class="v" id="srv">检测中…</span></div>
  <div class="row"><span class="k">汇总书签总数</span><span class="v" id="masterCnt">-</span></div>
  <div class="row">
    <span class="k">角色</span>
    <select id="role">
      <option value="follower">从（自动跟随主）</option>
      <option value="master">主（书签权威来源）</option>
    </select>
  </div>

  <div class="btns">
    <button id="btnPush">立即推送</button>
    <button id="btnPull" class="gray">立即拉取</button>
  </div>
  <div class="btns">
    <button id="btnSave" class="gray">保存角色设置</button>
  </div>

  <div class="sec">
    <div class="row"><span class="k">上次推送</span><span class="v" id="lp">-</span></div>
    <div class="row"><span class="k">上次拉取</span><span class="v" id="ll">-</span></div>
    <div class="row"><span class="k">上次补齐</span><span class="v" id="la">-</span></div>
  </div>

  <div class="err" id="err"></div>
  <div id="toast"></div>

  <div class="tip">
    <b>主 / 从（单向同步）</b><br>
    · <b>主</b>：书签变化自动推送（Chrome 请选这个）<br>
    · <b>从</b>：打开浏览器时、以及每天凌晨 1 点自动与主对齐；平时不自动推<br>
    · 从浏览器加了书签要回传给主 → <b>手动点「立即推送」</b><br>
    · 数据只在 <b>127.0.0.1</b> 流转，不经云端
  </div>

  <script src="popup.js"></script>
</body>
</html>
